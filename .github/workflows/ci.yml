name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Package and privacy checks
        run: python -B scripts/check_release.py
      - name: Whitespace checks
        run: git diff-tree --check HEAD

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          gitleaks_archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$gitleaks_archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $gitleaks_archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/vibe-wise-gitleaks"
          tar -xzf "$gitleaks_archive" -C "$RUNNER_TEMP/vibe-wise-gitleaks" gitleaks
      - name: Scan all Git history with redacted output
        run: '"$RUNNER_TEMP/vibe-wise-gitleaks/gitleaks" git --redact --no-banner --log-opts=--all .'

  native-discovery:
    name: Codex 0.162.0 discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Codex CLI
        run: npm install --prefix "$RUNNER_TEMP/vibe-wise-codex-cli" --no-audit --no-fund @openai/codex@0.162.0
      - name: Query skills and hooks without credentials or inference
        run: python -B scripts/smoke_app_server.py --codex "$RUNNER_TEMP/vibe-wise-codex-cli/node_modules/.bin/codex"
